name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImGui & Dobby
        run: |
          git clone --depth 1 https://github.com jni/imgui
          mkdir -p jni/dobby
          curl -L -s "https://github.com" -o dobby.tar.gz
          tar -xzf dobby.tar.gz -C jni/dobby/ || true
          find jni/dobby -name "*.a" -exec cp {} jni/dobby/libdobby.a \;
          find jni/dobby -name "dobby.h" -exec cp {} jni/dobby/dobby.h \;

      - name: Build .so
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnoomimod
          path: libs/arm64-v8a/libnoomimod.so
