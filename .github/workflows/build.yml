name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImGui
        run: |
          HOST="https://github.com"
          git clone --depth 1 "${HOST}/ocornut/imgui.git" jni/imgui

      - name: Build .so
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 APP_STL=c++_static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnoomimod
          path: libs/arm64-v8a/libnoomimod.so
