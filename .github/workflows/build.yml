name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Libraries
        run: |
          HOST="https://github.com"
          git clone --depth 1 "${HOST}/ocornut/imgui.git" jni/imgui
          git clone --depth 1 "${HOST}/jmpews/Dobby.git" dobby_src
          cmake -B dobby_build -S dobby_src \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF
          cmake --build dobby_build -j4
          mkdir -p jni/dobby
          find dobby_build -name "libdobby.a" -exec cp {} jni/dobby/ \;
          cp dobby_src/include/dobby.h jni/dobby/

      - name: Build .so
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnoomimod
          path: libs/arm64-v8a/libnoomimod.so
